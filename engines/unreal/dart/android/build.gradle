group 'com.xraph.gameframework.unreal'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.xraph.gameframework.unreal'
    compileSdk 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Unreal compiles its Android binary against NDK API 26 ("Compiling
        // Native 64-bit code with NDK API 'android-26'"), so a host that
        // declares less than that can install on a device where libUnreal.so
        // cannot load. Declaring it here rather than in the app means the
        // manifest merger raises any host that asks for less, and the host does
        // not have to know why.
        minSdkVersion 26
        targetSdkVersion 33
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.20"
}
