; Build Unreal as a library rather than the app, which is what embedding it in
; a Flutter host requires. This is the Android counterpart of bBuildAsFramework
; above, and like that one it is read by UnrealBuildTool rather than by the
; game: AndroidTargetRules.bEnableASISPlugin carries a [ConfigFile] attribute
; pointing at this exact section, so setting it here is what turns it on.
;
; Two things follow from it. UEBuildAndroid adds USE_ANDROID_STANDALONE=1,
; which compiles in the com/epicgames/asis/AsisGameActivity JNI entry points
; and makes the engine honour GAndroidWindowOverride in place of the window it
; would otherwise take from its own NativeActivity. And UEDeployAndroid stops
; giving GameActivity a LAUNCHER intent, so Unreal's activities stay declared
; but never start the app.
;
; The AndroidSingleInstanceService plugin that would normally supply the Java
; half of this is not in the engine tree, so the host provides that class
; itself. The engine looks the class up by name, so the name has to match.
[/Script/AndroidSingleInstanceServiceEditor.AndroidSingleInstanceServiceRuntimeSettings]
bEnableASISPlugin=True

