pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"

// The engine library modules are produced by "game export" and land here via
// "game sync", so whether they exist depends on which engines this app has
// exported. Including one unconditionally makes an app that uses only the other
// engine fail to configure, which is why both are guarded.
//
// app/build.gradle applies the matching dependency the same way.
["unityLibrary", "unrealLibrary"].each { module ->
    if (file(module).isDirectory()) {
        include ":$module"
        project(":$module").projectDir = file(module)
    }
}
